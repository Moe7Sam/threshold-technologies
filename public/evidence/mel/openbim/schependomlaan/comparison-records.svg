<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Schependomlaan comparison workbook records by week</title>
  <desc id="desc">A chart of data-row counts from the open Schependomlaan planned versus built comparison workbook: week 26 has 10, week 27 has 51, week 28 has 90, week 29 has 19, and week 30 has 5.</desc>
  <rect width="960" height="540" fill="#F5F2EC"/>
  <g stroke="#D4CFC3" stroke-width="1">
    <path d="M90 78H900M90 156H900M90 234H900M90 312H900M90 390H900M90 468H900"/>
    <path d="M90 58V468M252 58V468M414 58V468M576 58V468M738 58V468M900 58V468"/>
  </g>
  <g fill="#14181E" font-family="Arial, sans-serif">
    <text x="90" y="38" font-size="14" letter-spacing="2">OPEN DATA / COMPARISON WORKBOOK</text>
    <text x="900" y="38" font-size="14" letter-spacing="2" text-anchor="end">DATA ROWS / SHEET</text>
  </g>
  <g fill="#B08850">
    <rect x="130" y="423" width="82" height="45"/>
    <rect x="292" y="239" width="82" height="229"/>
    <rect x="454" y="68" width="82" height="400"/>
    <rect x="616" y="383" width="82" height="85"/>
    <rect x="778" y="446" width="82" height="22"/>
  </g>
  <g fill="#14181E" font-family="Arial, sans-serif">
    <text x="171" y="408" font-size="22" text-anchor="middle">10</text>
    <text x="333" y="224" font-size="22" text-anchor="middle">51</text>
    <text x="495" y="53" font-size="22" text-anchor="middle">90</text>
    <text x="657" y="368" font-size="22" text-anchor="middle">19</text>
    <text x="819" y="431" font-size="22" text-anchor="middle">5</text>
  </g>
  <g fill="#5A5F68" font-family="Arial, sans-serif" font-size="14" letter-spacing="1.5">
    <text x="171" y="502" text-anchor="middle">WEEK 26</text>
    <text x="333" y="502" text-anchor="middle">WEEK 27</text>
    <text x="495" y="502" text-anchor="middle">WEEK 28</text>
    <text x="657" y="502" text-anchor="middle">WEEK 29</text>
    <text x="819" y="502" text-anchor="middle">WEEK 30</text>
  </g>
</svg>
